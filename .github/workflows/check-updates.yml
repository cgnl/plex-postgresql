name: Monitor Plex Compatibility Candidates

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: plex-compatibility-monitor
  cancel-in-progress: false

jobs:
  candidate:
    name: Resolve, build and probe candidates (no release)
    uses: ./.github/workflows/docker-publish.yml
    secrets: inherit
