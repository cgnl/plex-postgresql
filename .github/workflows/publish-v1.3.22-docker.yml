name: Publish requested v1.3.22 Docker images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-v1.3.22-docker-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cgnl/plex-postgresql' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tested runtime matches the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse v1.3.22)" = 4e05604252a8fa08b130938ebd336693bfd5a601
          git diff --exit-code 5dd3b5161d2d330bc804e6a71034166e2aecbae6 v1.3.22 -- rust src schema scripts/docker-build-shim.sh scripts/docker-entrypoint.sh scripts/standalone-entrypoint.sh scripts/migrate_lib.sh
          gh run view 38128111622 --repo "$GITHUB_REPOSITORY" --json headSha,status > native-run.json
          python3 -c 'import json; r=json.load(open("native-run.json")); assert r["headSha"] == "5dd3b5161d2d330bc804e6a71034166e2aecbae6" and r["status"] == "completed"'
          gh run download 38128111622 --repo "$GITHUB_REPOSITORY" --pattern 'candidate-*' --dir native-evidence
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the tested AMD64 and ARM64 images
        run: python3 scripts/publish_v1_3_22_images.py native-evidence
      - name: Record the known recovery issue
        run: echo 'Published at the maintainer request. All 100-restart checks passed; the load test exposed HTTP 500 after PostgreSQL restart. This is a known release issue, not a full certification.' >> "$GITHUB_STEP_SUMMARY"
