name: Release Linux Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (for example: v0.9.14)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag (for example: v0.9.14)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }} artifact
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            out_name: db_interpose_pg-linux-x86_64.so
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            out_name: db_interpose_pg-linux-aarch64.so

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder rootfs for ${{ matrix.platform }}
        run: |
          set -eux
          mkdir -p out/${{ matrix.arch }} dist
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target builder \
            --output "type=local,dest=out/${{ matrix.arch }}" \
            .

      - name: Collect shim artifact
        run: |
          set -eux
          cp "out/${{ matrix.arch }}/libs/db_interpose_pg.so" "dist/${{ matrix.out_name }}"

      - name: Collect matching runtime libraries
        run: |
          set -eux
          mkdir -p "dist/libs/${{ matrix.arch }}"
          cp -L out/${{ matrix.arch }}/libs/*.so* "dist/libs/${{ matrix.arch }}/"
          rm "dist/libs/${{ matrix.arch }}/db_interpose_pg.so"
          test -s "dist/libs/${{ matrix.arch }}/libpq.so.5"
          test -s "dist/libs/${{ matrix.arch }}/libgcc_s.so.1"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  package-linux-zip:
    name: Package Linux zip bundle
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Determine tag
        id: tag
        run: |
          set -eu
          echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Build Linux zip
        run: |
          set -eux
          TAG="${{ steps.tag.outputs.value }}"
          STAGE="linux-zip"
          OUT="plex-postgresql-${TAG}-linux.zip"

          rm -rf "$STAGE"
          mkdir -p "$STAGE/scripts" "$STAGE/schema"

          cp release-assets/linux-x86_64/db_interpose_pg-linux-x86_64.so "$STAGE/"
          cp release-assets/linux-aarch64/db_interpose_pg-linux-aarch64.so "$STAGE/"
          mkdir -p "$STAGE/libs"
          cp -R release-assets/linux-x86_64/libs/x86_64 "$STAGE/libs/"
          cp -R release-assets/linux-aarch64/libs/aarch64 "$STAGE/libs/"

          cp README.md CHANGELOG.md INSTALL.md LICENSE THIRD_PARTY_LICENSES "$STAGE/"
          cp -R scripts/* "$STAGE/scripts/"
          cp schema/*.sql "$STAGE/schema/"

          (cd "$STAGE" && zip -r "../$OUT" .)
          shasum -a 256 "$OUT" > "$OUT.sha256"

      - name: Upload packaged zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-zip
          path: |
            plex-postgresql-*-linux.zip
            plex-postgresql-*-linux.zip.sha256
          if-no-files-found: error

  upload-release:
    name: Upload artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: package-linux-zip
    steps:
      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package-linux-zip.outputs.tag }}
          files: |
            release-assets/linux-release-zip/plex-postgresql-*-linux.zip
            release-assets/linux-release-zip/plex-postgresql-*-linux.zip.sha256
          overwrite_files: false
