name: Update Versions on Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  update-versions:
    name: Update version refs in wiki + READMEs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      # README version refs are updated manually before tagging.
      # The old auto-sed approach was fragile (broke on major version bumps).

      - name: Determine new version
        id: ver
        run: |
          set -eux
          NEW="$(cat VERSION)"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Clone wiki
        run: |
          set -eux
          git clone "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Update version in Home.md
        env:
          RELEASE_TAG: v${{ steps.ver.outputs.new }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          path = Path('wiki/Home.md')
          heading = f'## Latest published release: [{tag}](https://github.com/${{ github.repository }}/releases/tag/{tag})'
          text, count = re.subn(r'^## Latest (?:published )?release:.*$', heading, path.read_text(), flags=re.M | re.I)
          if count != 1:
              raise SystemExit('Expected one latest-release heading in wiki/Home.md')
          path.write_text(text)
          print(heading)
          PY

      - name: Push wiki changes
        run: |
          set -eux
          cd wiki
          git diff --quiet && { echo "No wiki changes"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Home.md
          git commit -m "Keep wiki readers on the published release" -m "Tested: Latest-release heading updated from VERSION"
          git push
