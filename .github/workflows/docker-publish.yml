name: Native Plex Acceptance Matrix

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Source ref to probe; never publishes release tags"
        required: true
        type: string
      upstream_profile:
        description: "Checked-in immutable profile JSON path"
        type: string
      upstream_profile_json:
        description: "Immutable profile JSON (exclusive with path)"
        type: string
      profile_id:
        description: "Profile artifact namespace"
        type: string
      mode:
        type: choice
        options: [full, probe]
        default: full
  workflow_call:
    outputs:
      failure_category:
        value: ${{ jobs.native-acceptance.outputs.failure_category }}
    inputs:
      version:
        description: "Source ref to probe; never publishes release tags"
        required: false
        type: string
      upstream_profile:
        type: string
      upstream_profile_json:
        type: string
      profile_id:
        type: string
      mode:
        type: string
        default: full
      payload_profile_id:
        description: "Shared latest payload namespace for sequential historical profiles"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      plex_version: ${{ steps.inputs.outputs.plex_version }}
      linuxserver_image: ${{ steps.inputs.outputs.linuxserver_image }}
      plexinc_image: ${{ steps.inputs.outputs.plexinc_image }}
      builder_image: ${{ steps.inputs.outputs.builder_image }}
      postgres_image: ${{ steps.inputs.outputs.postgres_image }}
      postgres15_image: ${{ steps.inputs.outputs.postgres15_image }}
      postgres18_image: ${{ steps.inputs.outputs.postgres18_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate candidate before any privileged build/test job
        env:
          CANDIDATE: ${{ inputs.version || github.sha }}
          TRUSTED: ${{ github.sha }}
          MODE: ${{ inputs.mode || 'full' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/${{ github.event.repository.default_branch }}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.repository.default_branch }}" --jq .sha)" = "$TRUSTED"
          python3 scripts/validate_certification_source.py --candidate "$CANDIDATE" --trusted "$TRUSTED" --mode "$MODE"
          git checkout --detach "$CANDIDATE"
      - name: Record exact source
        id: source
        env:
          PROFILE_ID: ${{ inputs.profile_id }}
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          [[ "$MODE" == full || "$MODE" == probe ]]
          [[ -z "$PROFILE_ID" || "$PROFILE_ID" =~ ^[A-Za-z0-9-]+$ ]]
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve all upstream inputs once
        id: inputs
        env:
          PROFILE_PATH: ${{ inputs.upstream_profile }}
          PROFILE_JSON: ${{ inputs.upstream_profile_json }}
          PROFILE_ID: ${{ inputs.profile_id }}
        run: |
          if [[ -n "$PROFILE_JSON" ]]; then
            test -z "$PROFILE_PATH"
            python3 scripts/release_certificate.py --profile-json "$PROFILE_JSON" --profile-id "$PROFILE_ID" --output evidence/upstream-candidate.json
          elif [[ -n "$PROFILE_PATH" ]]; then
            python3 scripts/release_certificate.py --profile "$PROFILE_PATH" --profile-id "$PROFILE_ID" --output evidence/upstream-candidate.json
          else
            test -z "$PROFILE_ID"
            python3 scripts/check-upstream-updates.py --output evidence/upstream-candidate.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-upstream-candidate', inputs.profile_id) || 'upstream-candidate' }}
          path: evidence/upstream-candidate.json
          if-no-files-found: error

  media-fixtures:
    name: Prepare pinned real media once
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - name: Fetch and verify immutable movie and TV fixtures
        run: python3 scripts/prepare-media-fixtures.py media-fixture-cache
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-pinned-real-media', inputs.profile_id) || 'pinned-real-media' }}
          path: media-fixture-cache
          compression-level: 0
          if-no-files-found: error

  runtime-e2e:
    name: Require the real interpose runtime E2E driver
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Use an isolated Docker client configuration
        run: |
          set -eu
          docker_config=$(mktemp -d "$RUNNER_TEMP/plex-docker-config.XXXXXX")
          printf '{}\n' > "$docker_config/config.json"
          chmod 700 "$docker_config"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - name: Start the owned PostgreSQL fixture
        id: postgres
        env:
          POSTGRES_IMAGE: ${{ needs.resolve.outputs.postgres_image }}
        run: |
          set -eu
          ownership="runtime-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          container_file=$(mktemp "$RUNNER_TEMP/runtime-e2e-postgres.XXXXXX")
          echo "RUNTIME_E2E_CONTAINER_FILE=$container_file" >> "$GITHUB_ENV"
          docker pull "$POSTGRES_IMAGE"
          container=$(docker create \
            --label plex-postgresql.test=runtime-e2e \
            --label "plex-postgresql.run=$ownership" \
            -e POSTGRES_USER=runtime_e2e_admin \
            -e POSTGRES_PASSWORD=runtime_e2e_fixture_password \
            -e POSTGRES_DB=runtime_e2e_admin \
            -p 127.0.0.1::5432 "$POSTGRES_IMAGE")
          printf '%s\n' "$container" > "$container_file"
          docker start "$container" >/dev/null
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -h 127.0.0.1 -p 5432 -U runtime_e2e_admin -d runtime_e2e_admin >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          binding=$(docker port "$container" 5432/tcp)
          [[ "$binding" =~ ^127\.0\.0\.1:([0-9]+)$ ]]
          echo "port=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install existing native link prerequisites
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libsqlite3-dev postgresql-client
      - name: Runtime routing and reconnect (missing driver fails)
        env:
          RUNTIME_E2E_EXTERNAL_FIXTURE: '1'
          RUNTIME_E2E_ADMIN_HOST: 127.0.0.1
          RUNTIME_E2E_ADMIN_PORT: ${{ steps.postgres.outputs.port }}
          RUNTIME_E2E_ADMIN_USER: runtime_e2e_admin
          RUNTIME_E2E_ADMIN_PASSWORD: runtime_e2e_fixture_password
          RUNTIME_E2E_ADMIN_DATABASE: runtime_e2e_admin
        run: bash scripts/run-runtime-e2e.sh --reconnect

      - name: Clean up the owned PostgreSQL fixture
        if: always()
        run: |
          set -eu
          if [[ -z "${RUNTIME_E2E_CONTAINER_FILE:-}" || ! -s "$RUNTIME_E2E_CONTAINER_FILE" ]]; then
            exit 0
          fi
          container=$(cat "$RUNTIME_E2E_CONTAINER_FILE")
          [[ "$container" =~ ^[0-9a-f]{64}$ ]]
          expected="runtime-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          actual=$(docker inspect --format '{{ index .Config.Labels "plex-postgresql.run" }}' "$container")
          kind=$(docker inspect --format '{{ index .Config.Labels "plex-postgresql.test" }}' "$container")
          [[ "$actual" == "$expected" && "$kind" == runtime-e2e ]]
          if [[ "${{ job.status }}" != success ]]; then
            docker logs --tail 80 "$container" || true
          fi
          docker rm -fv "$container"
          rm "$RUNTIME_E2E_CONTAINER_FILE"

  candidate-image:
    name: Build ${{ matrix.variant }} / ${{ matrix.arch }}
    needs: [resolve, linux-bundle]
    if: ${{ always() && needs.resolve.result == 'success' && needs.linux-bundle.result == 'success' }}
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - variant: linuxserver
            dockerfile: Dockerfile
            arch: amd64
            runner: ubuntu-24.04
          - variant: linuxserver
            dockerfile: Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: plexinc
            dockerfile: Dockerfile.standalone
            arch: amd64
            runner: ubuntu-24.04
          - variant: plexinc
            dockerfile: Dockerfile.standalone
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Use an isolated Docker client configuration
        run: |
          set -eu
          docker_config=$(mktemp -d "$RUNNER_TEMP/plex-docker-config.XXXXXX")
          printf '{}\n' > "$docker_config/config.json"
          chmod 700 "$docker_config"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-upstream-candidate', inputs.profile_id) || 'upstream-candidate' }}
          path: evidence
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Candidate repository and unique tag
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
          PROFILE_ID: ${{ inputs.profile_id }}
        run: |
          set -eu
          IMAGE="ghcr.io/${REPOSITORY_OWNER,,}/plex-postgresql-${VARIANT}"
          echo "repository=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PROFILE_ID:-legacy}-${ARCH}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ (inputs.payload_profile_id || inputs.profile_id) && format('{0}-', inputs.payload_profile_id || inputs.profile_id) || '' }}runtime-payload-${{ matrix.arch }}
          path: certified-payload
      - name: Build once; push candidate only
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            BUILDER_IMAGE=${{ needs.resolve.outputs.builder_image }}
            PLEX_BASE_IMAGE=${{ matrix.variant == 'linuxserver' && needs.resolve.outputs.linuxserver_image || needs.resolve.outputs.plexinc_image }}
            RUNTIME_PAYLOAD=certified_payload
          build-contexts: |
            certified_payload=./certified-payload
      - name: Preserve immutable build identity
        env:
          CANDIDATE_REPOSITORY: ${{ steps.image.outputs.repository }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          printf '%s\n' "$CANDIDATE_REPOSITORY@$CANDIDATE_DIGEST" > evidence/candidate-ref.txt
          printf '%s\n' "$BUILD_METADATA" > evidence/build-metadata.json
          printf '%s\n' "$SOURCE_SHA" > evidence/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-', inputs.profile_id) || '' }}built-image-${{ matrix.variant }}-${{ matrix.arch }}
          path: evidence
          if-no-files-found: error

  candidate:
    name: Probe ${{ matrix.variant }} / ${{ matrix.arch }} / PG${{ matrix.postgres }}
    needs: [resolve, media-fixtures, candidate-image]
    if: ${{ always() && needs.resolve.result == 'success' && needs.media-fixtures.result == 'success' && needs.candidate-image.result == 'success' }}
    permissions:
      contents: read
      packages: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy: &native_strategy
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - variant: linuxserver
            dockerfile: Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            postgres: 15
          - variant: linuxserver
            dockerfile: Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            postgres: 18
          - variant: linuxserver
            dockerfile: Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            postgres: 15
          - variant: linuxserver
            dockerfile: Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            postgres: 18
          - variant: plexinc
            dockerfile: Dockerfile.standalone
            arch: amd64
            runner: ubuntu-24.04
            postgres: 15
          - variant: plexinc
            dockerfile: Dockerfile.standalone
            arch: amd64
            runner: ubuntu-24.04
            postgres: 18
          - variant: plexinc
            dockerfile: Dockerfile.standalone
            arch: arm64
            runner: ubuntu-24.04-arm
            postgres: 15
          - variant: plexinc
            dockerfile: Dockerfile.standalone
            arch: arm64
            runner: ubuntu-24.04-arm
            postgres: 18
    steps:
      - name: Use an isolated Docker client configuration
        run: |
          set -eu
          docker_config=$(mktemp -d "$RUNNER_TEMP/plex-docker-config.XXXXXX")
          printf '{}\n' > "$docker_config/config.json"
          chmod 700 "$docker_config"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-pinned-real-media', inputs.profile_id) || 'pinned-real-media' }}
          path: media-fixture-cache
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-', inputs.profile_id) || '' }}built-image-${{ matrix.variant }}-${{ matrix.arch }}
          path: evidence
      - name: Require the shared immutable image on the resolved source
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          root = Path('evidence')
          image = (root / 'candidate-ref.txt').read_text().strip()
          prefix = 'ghcr.io/' + os.environ['REPOSITORY_OWNER'].lower() + '/plex-postgresql-' + os.environ['VARIANT'] + '@'
          if not image.startswith(prefix) or not re.fullmatch(r'sha256:[0-9a-f]{64}', image[len(prefix):]):
              raise SystemExit('Shared image must be an immutable candidate digest')
          if (root / 'source-sha.txt').read_text().strip() != os.environ['SOURCE_SHA']:
              raise SystemExit('Shared image source mismatch')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CANDIDATE_IMAGE=' + image + '\n')
          PYCODE
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-linux-release-zip', inputs.profile_id) || 'linux-release-zip' }}
          path: release-bundle
      - name: Bind the container payload to exact certified bundle bytes
        env:
          CANDIDATE: ${{ env.CANDIDATE_IMAGE }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull "$CANDIDATE"
          container=$(docker create "$CANDIDATE")
          trap 'docker rm -v "$container"' EXIT
          docker cp "$container:/usr/local/lib/plex-postgresql" container-payload
          bundle=$(find release-bundle -maxdepth 1 -name '*.zip' -type f)
          python3 scripts/verify_candidate_payload.py --bundle "$bundle" --directory container-payload --arch "$ARCH" --output evidence/payload-binding.json
          python3 - <<'PY'
          import json, os, re
          checksum = json.load(open('evidence/payload-binding.json'))['bundle_sha256']
          assert re.fullmatch('[0-9a-f]{64}', checksum)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PLEX_E2E_BUNDLE_SHA256=' + checksum + '\n')
          PY
      - name: Prepare offline crash diagnostics
        run: |
          if ! command -v gdb >/dev/null; then
            sudo -n apt-get update -qq
            sudo -n apt-get install --no-install-recommends -y gdb
          fi
          command -v coredumpctl
          command -v timeout
          sudo -n true
          gdb --version
          coredumpctl --version
      - name: Verify the exact candidate digest
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          BASE_PLEX_IMAGE: ${{ matrix.variant == 'linuxserver' && needs.resolve.outputs.linuxserver_image || needs.resolve.outputs.plexinc_image }}
          POSTGRES_IMAGE: ${{ needs.resolve.outputs[format('postgres{0}_image', matrix.postgres)] }}
          EXPECTED_PLEX_VERSION: ${{ needs.resolve.outputs.plex_version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          EVIDENCE_DIR: evidence/container
          PLEX_E2E_MEDIA_CACHE_DIR: ${{ github.workspace }}/media-fixture-cache
          PLEX_E2E_RESTART_CYCLES: ${{ inputs.mode == 'probe' && '1' || '100' }}
        run: bash scripts/plex-container-e2e.sh
      - name: Preserve PostgreSQL lane identity
        if: always()
        env:
          POSTGRES_MAJOR: ${{ matrix.postgres }}
          POSTGRES_IMAGE: ${{ needs.resolve.outputs[format('postgres{0}_image', matrix.postgres)] }}
        run: |
          mkdir -p evidence
          printf '%s\n' "$POSTGRES_MAJOR" > evidence/postgres-major.txt
          printf '%s\n' "$POSTGRES_IMAGE" > evidence/postgres-ref.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.profile_id && format('{0}-', inputs.profile_id) || '' }}candidate-${{ matrix.variant }}-${{ matrix.arch }}-pg${{ matrix.postgres }}
          path: evidence
          if-no-files-found: error

  soak:
    name: Soak 5h50 / ${{ matrix.variant }} / ${{ matrix.arch }} / PG${{ matrix.postgres }}
    if: ${{ always() && inputs.mode != 'probe' && needs.resolve.result == 'success' && needs.runtime-e2e.result == 'success' }}
    needs: [resolve, runtime-e2e, candidate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    strategy: *native_strategy
    steps:
      - name: Use an isolated Docker client configuration
        run: |
          set -eu
          docker_config=$(mktemp -d "$RUNNER_TEMP/plex-docker-config.XXXXXX")
          printf '{}\n' > "$docker_config/config.json"
          chmod 700 "$docker_config"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-pinned-real-media', inputs.profile_id) || 'pinned-real-media' }}
          path: media-fixture-cache
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-', inputs.profile_id) || '' }}candidate-${{ matrix.variant }}-${{ matrix.arch }}-pg${{ matrix.postgres }}
          path: prior-evidence
      - name: Require completed 100-cycle smoke on the exact source and digest
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          EXPECTED_PLEX_VERSION: ${{ needs.resolve.outputs.plex_version }}
          EXPECTED_VARIANT: ${{ matrix.variant }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_POSTGRES_IMAGE: ${{ needs.resolve.outputs[format('postgres{0}_image', matrix.postgres)] }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REQUIRED_CYCLES: ${{ inputs.mode == 'probe' && '1' || '100' }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path('prior-evidence')
          result = json.loads((root / 'container/result.json').read_text())
          image = (root / 'candidate-ref.txt').read_text().strip()
          prefix = 'ghcr.io/' + os.environ['REPOSITORY_OWNER'].lower() + '/plex-postgresql-' + os.environ['EXPECTED_VARIANT'] + '@'
          if not image.startswith(prefix) or not re.fullmatch(r'sha256:[0-9a-f]{64}', image[len(prefix):]):
              raise SystemExit('Invalid candidate digest')
          if (root / 'source-sha.txt').read_text().strip() != os.environ['EXPECTED_SOURCE_SHA']:
              raise SystemExit('Source evidence mismatch')
          if (root / 'postgres-ref.txt').read_text().strip() != os.environ['EXPECTED_POSTGRES_IMAGE']:
              raise SystemExit('PostgreSQL evidence mismatch')
          expected = {'candidate': image, 'plex_version': os.environ['EXPECTED_PLEX_VERSION'], 'variant': os.environ['EXPECTED_VARIANT'], 'arch': os.environ['EXPECTED_ARCH'], 'phase': 'native-workload-complete', 'exit_code': 0, 'workload_passed': True, 'restart_cycles_requested': 100, 'restart_cycles_completed': 100, 'live_postgres_recovery_verified': True, 'decoded_fixture_verified': True, 'real_movie_and_tv_playback_verified': True, 'real_media_full_decode_verified': True, 'native_import_and_rollback_verified': True, 'four_concurrent_real_media_clients_verified': True, 'promotion_allowed': False}
          expected['restart_cycles_requested'] = int(os.environ['REQUIRED_CYCLES'])
          expected['restart_cycles_completed'] = int(os.environ['REQUIRED_CYCLES'])
          if any(result.get(key) != value for key, value in expected.items()):
              raise SystemExit('Prior native smoke failed or is incomplete')
          binding = json.loads((root / 'payload-binding.json').read_text())
          checksum = binding['bundle_sha256']
          if not re.fullmatch('[0-9a-f]{64}', checksum) or result.get('bundle_sha256') != checksum:
              raise SystemExit('Prior native bundle binding mismatch')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('CANDIDATE_IMAGE=' + image + '\n')
              output.write('PLEX_E2E_BUNDLE_SHA256=' + checksum + '\n')
          PY
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare offline crash diagnostics
        run: |
          if ! command -v gdb >/dev/null; then
            sudo -n apt-get update -qq
            sudo -n apt-get install --no-install-recommends -y gdb
          fi
          command -v coredumpctl
          command -v timeout
          sudo -n true
          gdb --version
          coredumpctl --version
      - name: Continuous native mixed fixture workload for 21000 seconds
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          POSTGRES_IMAGE: ${{ needs.resolve.outputs[format('postgres{0}_image', matrix.postgres)] }}
          EXPECTED_PLEX_VERSION: ${{ needs.resolve.outputs.plex_version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
          PLEX_E2E_RESTART_CYCLES: '1'
          PLEX_E2E_SOAK_SECONDS: ${{ inputs.mode == 'probe' && '60' || '21000' }}
          EVIDENCE_DIR: evidence/soak
          PLEX_E2E_MEDIA_CACHE_DIR: ${{ github.workspace }}/media-fixture-cache
        run: bash scripts/plex-container-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.profile_id && format('{0}-', inputs.profile_id) || '' }}soak-${{ matrix.variant }}-${{ matrix.arch }}-pg${{ matrix.postgres }}
          path: evidence
          if-no-files-found: error

  native-acceptance:
    name: Require complete native workload evidence
    if: always()
    needs: [resolve, media-fixtures, runtime-e2e, candidate, soak, native-bundle-install]
    runs-on: ubuntu-latest
    outputs:
      failure_category: ${{ steps.observation.outputs.failure_category }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - name: Verify every native matrix lane completed
        env:
          RESOLUTION: ${{ needs.resolve.result }}
          RUNTIME: ${{ needs.runtime-e2e.result }}
          CANDIDATES: ${{ needs.candidate.result }}
          SOAK: ${{ needs.soak.result }}
          BUNDLES: ${{ needs.native-bundle-install.result }}
          MEDIA: ${{ needs.media-fixtures.result }}
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          test "$RESOLUTION" = success
          test "$RUNTIME" = success
          test "$CANDIDATES" = success
          if [ "$MODE" = probe ]; then
            test "$SOAK" = skipped
          else
            test "$MODE" = full
            test "$SOAK" = success
          fi
          test "$BUNDLES" = success
          test "$MEDIA" = success
          echo 'PASS all declared native workload lanes. Image promotion remains a separate action.'
      - uses: actions/download-artifact@v4
        if: always() && inputs.profile_id != ''
        continue-on-error: true
        with:
          pattern: ${{ inputs.profile_id }}-candidate-*
          path: observation-evidence
      - id: observation
        if: always() && inputs.upstream_profile_json != ''
        env:
          PROFILE_JSON: ${{ inputs.upstream_profile_json }}
          SOURCE: ${{ needs.resolve.outputs.source_sha }}
          MODE: ${{ inputs.mode || 'full' }}
          JOBS_PASSED: ${{ needs.resolve.result == 'success' && needs.media-fixtures.result == 'success' && needs.runtime-e2e.result == 'success' && needs.candidate.result == 'success' && ((inputs.mode == 'probe' && needs.soak.result == 'skipped') || (inputs.mode != 'probe' && needs.soak.result == 'success')) && needs.native-bundle-install.result == 'success' }}
        run: python3 scripts/native_compatibility_observation.py --root observation-evidence --profile-json "$PROFILE_JSON" --source "$SOURCE" --mode "$MODE" --jobs-passed "$JOBS_PASSED" --output observation/observation.json
      - uses: actions/upload-artifact@v4
        if: always() && inputs.upstream_profile_json != ''
        with:
          name: ${{ inputs.profile_id }}-compatibility-observation
          path: observation/observation.json
          if-no-files-found: error

  native-bundle-install:
    name: Native ZIP / ${{ matrix.variant }} / ${{ matrix.arch }}
    needs: [resolve, linux-bundle]
    if: ${{ always() && needs.resolve.result == 'success' && needs.linux-bundle.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: linuxserver
            arch: amd64
            bundle_arch: x86_64
            runner: ubuntu-24.04
          - variant: linuxserver
            arch: arm64
            bundle_arch: aarch64
            runner: ubuntu-24.04-arm
          - variant: plexinc
            arch: amd64
            bundle_arch: x86_64
            runner: ubuntu-24.04
          - variant: plexinc
            arch: arm64
            bundle_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Use an isolated Docker client configuration
        run: |
          set -eu
          docker_config=$(mktemp -d "$RUNNER_TEMP/plex-docker-config.XXXXXX")
          printf '{}\n' > "$docker_config/config.json"
          chmod 700 "$docker_config"
          chmod 600 "$docker_config/config.json"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-linux-release-zip', inputs.profile_id) || 'linux-release-zip' }}
          path: release-bundle
      - name: Verify the ZIP on the unmodified pinned Plex image
        env:
          BASE_PLEX_IMAGE: ${{ matrix.variant == 'linuxserver' && needs.resolve.outputs.linuxserver_image || needs.resolve.outputs.plexinc_image }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          EVIDENCE_DIR: evidence/native-bundle
          POSTGRES_IMAGE: ${{ needs.resolve.outputs.postgres15_image }}
        run: |
          bundle=$(find release-bundle -maxdepth 1 -name '*.zip' -type f)
          test "$(printf '%s\n' "$bundle" | wc -l)" -eq 1
          mkdir -p evidence
          sha256sum "$bundle" > evidence/bundle-sha256.txt
          bash scripts/test-native-linux-bundle.sh "$bundle"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.profile_id && format('{0}-', inputs.profile_id) || '' }}native-bundle-${{ matrix.variant }}-${{ matrix.arch }}
          path: evidence
          if-no-files-found: error

  linux-payload:
    if: inputs.payload_profile_id == '' || inputs.payload_profile_id == inputs.profile_id
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            bundle_arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            bundle_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build one native payload
        env:
          BUILDER_IMAGE: ${{ needs.resolve.outputs.builder_image }}
          ARCH: ${{ matrix.arch }}
          BUNDLE_ARCH: ${{ matrix.bundle_arch }}
        run: |
          docker buildx build --file Dockerfile.standalone --platform "linux/$ARCH" --target export-payload --build-arg "BUILDER_IMAGE=$BUILDER_IMAGE" --output type=local,dest=bundle-root .
          mkdir -p "payload/libs/$BUNDLE_ARCH"
          cp bundle-root/libs/db_interpose_pg.so "payload/db_interpose_pg-linux-$BUNDLE_ARCH.so"
          cp -L bundle-root/libs/*.so* "payload/libs/$BUNDLE_ARCH/"
          rm "payload/libs/$BUNDLE_ARCH/db_interpose_pg.so"
          mkdir -p runtime-payload/libs
          cp -L bundle-root/libs/* runtime-payload/libs/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-', inputs.profile_id) || '' }}runtime-payload-${{ matrix.arch }}
          path: runtime-payload
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-', inputs.profile_id) || '' }}linux-payload-${{ matrix.bundle_arch }}
          path: payload
          if-no-files-found: error

  linux-bundle:
    needs: [resolve, linux-payload]
    if: always() && needs.resolve.result == 'success' && (needs.linux-payload.result == 'success' || needs.linux-payload.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.payload_profile_id == '' || inputs.payload_profile_id == inputs.profile_id
        with:
          pattern: ${{ inputs.profile_id && format('{0}-linux-payload-*', inputs.profile_id) || 'linux-payload-*' }}
          merge-multiple: true
          path: bundle
      - uses: actions/download-artifact@v4
        if: inputs.payload_profile_id != '' && inputs.payload_profile_id != inputs.profile_id
        with:
          name: ${{ inputs.payload_profile_id }}-linux-release-zip
          path: release-bundle
      - name: Assemble the final exact Linux ZIP before acceptance
        if: inputs.payload_profile_id == '' || inputs.payload_profile_id == inputs.profile_id
        run: |
          mkdir -p bundle/scripts bundle/schema release-bundle
          cp README.md CHANGELOG.md INSTALL.md LICENSE THIRD_PARTY_LICENSES bundle/
          cp -R scripts/. bundle/scripts/
          cp schema/*.sql bundle/schema/
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          (cd bundle && zip -r "../release-bundle/plex-postgresql-v$version-linux.zip" .)
          (cd release-bundle && sha256sum *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.profile_id && format('{0}-linux-release-zip', inputs.profile_id) || 'linux-release-zip' }}
          path: release-bundle
          if-no-files-found: error
          retention-days: 90
