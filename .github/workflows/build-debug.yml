name: Build Debug / Sanitizer Image

on:
  workflow_dispatch:
    inputs:
      sanitizer:
        description: 'Sanitizer type (address, thread, or empty for debug symbols only)'
        required: false
        default: 'address'
        type: choice
        options:
          - address
          - thread
          - ''

jobs:
  build-debug:
    name: Build Debug / Sanitizer (${{ matrix.name }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linuxserver
            dockerfile: Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/plex-postgresql-debug
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: linuxserver
            dockerfile: Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/plex-postgresql-debug
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          # Optionally add plexinc variant if you use it

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push debug image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ${{ matrix.image }}:${{ github.sha }}-${{ matrix.arch }}
            ${{ matrix.image }}:latest-${{ matrix.arch }}
          build-args: |
            PLEX_PG_SANITIZE=${{ inputs.sanitizer }}
          # Optionally add other debug flags via environment variables if needed

  manifest-debug:
    name: Create multi-arch manifest for debug
    runs-on: ubuntu-latest
    needs: build-debug
    if: always()
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          set -eux
          IMAGE="ghcr.io/${{ github.repository_owner }}/plex-postgresql-debug"
          SHA="${{ github.sha }}"
          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"
          docker manifest push "${IMAGE}:latest"
          # Also tag with sanitizer type if needed
          if [ -n "${{ inputs.sanitizer }}" ]; then
            docker manifest create "${IMAGE}:${{ inputs.sanitizer }}" \
              "${IMAGE}:${SHA}-amd64" \
              "${IMAGE}:${SHA}-arm64"
            docker manifest push "${IMAGE}:${{ inputs.sanitizer }}"
          fi
